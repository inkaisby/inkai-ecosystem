name: inkai_mobile
description: Official Mobile Application for INKAI Members.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  google_fonts: ^6.1.0
  flutter_lucide: ^1.8.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  timeago: ^3.7.1
  url_launcher: ^6.3.2
  socket_io_client: ^3.1.0
  image_picker: ^1.2.2
  file_picker: 8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
